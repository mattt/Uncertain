name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    strategy:
      matrix:
        include:
          - swift-version: "6.0"
            runner: macos-15
            xcode: "16.0"
          - swift-version: "6.4"
            runner: xcode-27
            xcode: "27.0"

    name: Build and Test (Swift ${{ matrix.swift-version }})

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: xcrun --toolchain XcodeDefault swift build -v
    - name: Run tests
      run: xcrun --toolchain XcodeDefault swift test -v
